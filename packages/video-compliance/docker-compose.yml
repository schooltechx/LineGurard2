services:

  # ─── Ollama (Qwen2.5-VL-3B) ───────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: compliance_ollama
    restart: unless-stopped
    # ถ้ามี NVIDIA GPU ให้เปิด comment ด้านล่าง
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # ดึง model อัตโนมัติเมื่อ container เริ่ม
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull qwen2.5vl:3b &&
             wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # รอ pull model ก่อน

  # ─── FastAPI App ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance_api
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # OLLAMA_MODEL: qwen2.5vl:3b
      OLLAMA_MODEL: "qwen/qwen3-vl-4b"
      OLLAMA_TIMEOUT: "180"
    volumes:
      - sqlite_data:/data
    # ชี้ SQLite ไปที่ persistent volume
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 2
        --log-level info

volumes:
  ollama_data:
  sqlite_data:
